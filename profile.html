<!doctype html>
<html lang="en" class="auth-pending">
  <head>
    <title>Your account | Soma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/shared/site-header.css" />
    <link rel="stylesheet" href="styles/pages/profile.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="amazon.html">Soma</a>

      <nav class="site-header-actions" aria-label="Account">
        <a class="header-account" href="profile.html" aria-current="page">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <span class="js-user-name">Hello, account</span>
        </a>
        <a class="icon-button" href="orders.html" aria-label="Orders">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z" /><path d="m3 8 9 5 9-5M12 13v8" /></svg>
        </a>
        <a class="icon-button cart-link" href="checkout.html" aria-label="Cart">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z" /><path d="M9 8V7a3 3 0 0 1 6 0v1" /></svg>
          <span class="cart-quantity js-cart-quantity" hidden>0</span>
        </a>
      </nav>
    </header>

    <main class="main">
      <div class="page-heading">
        <a class="icon-button back-button" href="amazon.html" aria-label="Back to shop">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" /></svg>
        </a>
        <h1 class="page-title">Account</h1>
      </div>

      <section class="profile-card card">
        <div class="profile-identity">
          <div class="profile-avatar" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          </div>
          <div>
            <p class="profile-name" data-profile-name>Loading...</p>
            <p class="profile-intro">Your signed-in account information.</p>
          </div>
        </div>

        <dl class="profile-details">
          <div class="profile-detail-row">
            <dt>Email</dt>
            <dd data-profile-email>Loading...</dd>
          </div>
          <div class="profile-detail-row">
            <dt>Sign-in method</dt>
            <dd data-profile-provider>Loading...</dd>
          </div>
          <div class="profile-detail-row">
            <dt>Member since</dt>
            <dd data-profile-created>Loading...</dd>
          </div>
        </dl>

        <p class="profile-error" data-profile-error role="alert"></p>

        <div class="profile-actions">
          <a class="button-primary" href="amazon.html">Continue shopping</a>
          <button class="button-secondary sign-out-button js-logout" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10" /></svg>
            Sign out
          </button>
        </div>
      </section>

      <section class="history-card card" aria-labelledby="history-title">
        <div class="history-header">
          <h2 class="history-title" id="history-title">Purchase history</h2>
          <a class="link-primary" href="orders.html">View all orders</a>
        </div>

        <div class="history-stats js-history-stats"></div>

        <ul class="history-list js-history-list">
          <li class="history-empty">Loading...</li>
        </ul>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Primary">
      <a class="tab-link" href="amazon.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4z" /></svg>
        <span>Home</span>
      </a>
      <a class="tab-link" href="amazon.html#search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
        <span>Search</span>
      </a>
      <a class="tab-cart" href="checkout.html" aria-label="Cart">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6z" /><path d="M9 8V7a3 3 0 0 1 6 0v1" /></svg>
        <span class="cart-quantity js-cart-quantity" hidden>0</span>
      </a>
      <a class="tab-link" href="orders.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z" /><path d="m3 8 9 5 9-5M12 13v8" /></svg>
        <span>Orders</span>
      </a>
      <a class="tab-link" href="profile.html" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
        <span>Account</span>
      </a>
    </nav>

    <script type="module" src="scripts/profile.js"></script>
  </body>
</html>
