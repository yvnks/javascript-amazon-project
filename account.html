<!doctype html>
<html>
  <head>
    <title>Soma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/account.css" />
  </head>
  <body>
    <div class="auth-background" id="auth-background" aria-hidden="true"></div>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-panel">
          <h1>Connecting retailers.</h1>
          <p class="auth-subtitle">Sign into your account</p>

          <form class="js-login-form">
            <input
              type="email"
              name="email"
              placeholder="Username or email"
              aria-label="Username or email"
              required
            />

            <input
              type="password"
              name="password"
              placeholder="Password"
              aria-label="Password"
              required
            />

            <button class="auth-button" type="submit" disabled>Continue</button>
            <p class="auth-legal">
              By continuing, you agree to our
              <a
                href="https://x.com/tos"
                target="_blank"
                rel="noopener noreferrer"
                >Terms of Service</a
              >,
              <a
                href="https://x.com/privacy"
                target="_blank"
                rel="noopener noreferrer"
                >Privacy Policy</a
              >
              and
              <a
                href="https://help.x.com/rules-and-policies/twitter-cookies"
                target="_blank"
                rel="noopener noreferrer"
                >Cookie Use</a
              >.
            </p>
            <div class="js-login-message auth-message"></div>
          </form>
        </div>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <div class="auth-google-wrap">
          <div class="js-google-signin" id="google-signin-button"></div>
          <div class="js-google-message auth-message"></div>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/auth-background.js"></script>
    <script type="module" src="scripts/account.js"></script>
  </body>
</html>
