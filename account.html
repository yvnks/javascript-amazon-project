<!doctype html>
<html lang="en">
  <head>
    <title>Sign in | Soma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/shared/general.css" />
    <link rel="stylesheet" href="styles/pages/account.css" />
  </head>
  <body>
    <div class="auth-background" id="auth-background" aria-hidden="true"></div>

    <main class="auth-page">
      <div class="auth-card">
        <p class="auth-logo">Soma</p>

        <div class="auth-tabs" role="tablist" aria-label="Account">
          <button class="auth-tab js-auth-tab" type="button" role="tab"
            id="tab-login" aria-controls="panel-login" aria-selected="true"
            data-panel="login">
            Sign in
          </button>
          <button class="auth-tab js-auth-tab" type="button" role="tab"
            id="tab-register" aria-controls="panel-register" aria-selected="false"
            data-panel="register" tabindex="-1">
            Create account
          </button>
        </div>

        <section class="auth-panel" id="panel-login" role="tabpanel" aria-labelledby="tab-login">
          <h1>Welcome back</h1>
          <p class="auth-subtitle">Sign in to keep shopping and track your orders.</p>

          <form class="js-login-form" novalidate>
            <label>
              <span>Gmail address</span>
              <input type="email" name="email" placeholder="you@gmail.com" autocomplete="email" required />
            </label>

            <label>
              <span>Password</span>
              <input type="password" name="password" placeholder="Your password" autocomplete="current-password" required />
            </label>

            <div class="js-login-message auth-message" role="alert"></div>
            <button class="auth-button button-primary" type="submit" disabled>Sign in</button>
          </form>
        </section>

        <section class="auth-panel" id="panel-register" role="tabpanel" aria-labelledby="tab-register" hidden>
          <h1>Create your account</h1>
          <p class="auth-subtitle">New to Soma? It takes less than a minute.</p>

          <form class="js-register-form" novalidate>
            <label>
              <span>Full name</span>
              <input type="text" name="name" placeholder="Your name" autocomplete="name" required />
            </label>

            <label>
              <span>Gmail address</span>
              <input type="email" name="email" placeholder="you@gmail.com" autocomplete="email" required />
            </label>

            <div class="auth-field-row">
              <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="6+ characters" autocomplete="new-password" minlength="6" required />
              </label>

              <label>
                <span>Confirm password</span>
                <input type="password" name="confirmPassword" placeholder="Repeat it" autocomplete="new-password" minlength="6" required />
              </label>
            </div>

            <div class="js-register-message auth-message" role="alert"></div>
            <button class="auth-button button-primary" type="submit" disabled>Create account</button>
          </form>
        </section>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <div class="auth-google-wrap">
          <div class="js-google-signin" id="google-signin-button"></div>
          <div class="js-google-message auth-message"></div>
        </div>

        <p class="auth-legal">
          By continuing, you agree to our
          <a href="https://x.com/tos" target="_blank" rel="noopener noreferrer">Terms of Service</a>,
          <a href="https://x.com/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
          and
          <a href="https://help.x.com/rules-and-policies/twitter-cookies" target="_blank" rel="noopener noreferrer">Cookie Use</a>.
        </p>
      </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="scripts/auth-background.js"></script>
    <script type="module" src="scripts/account.js"></script>
  </body>
</html>
